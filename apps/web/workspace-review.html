<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Workspace review · Jarvistark</title>
	<style>
		:root { color-scheme: light; font: 100%/1.55 "Inter", system-ui, sans-serif; color: #1c302b; background: #f6f7f2; }
		* { box-sizing: border-box; }
		body { margin: 0; }
		header { background: #163c33; color: white; padding: .95rem max(5vw, calc((100% - 61rem) / 2)); font-weight: 700; letter-spacing: .015em; }
		main { max-width: 63rem; margin: 2.5rem auto 5rem; padding: 0 1.25rem; }
		h1 { font: 500 clamp(2.2rem, 6vw, 3.5rem)/1.12 "Georgia", serif; margin: .35em 0; letter-spacing: -.035em; }
		h2 { font-size: 1.3rem; margin: 0 0 .6rem; }
		h3 { font-size: 1rem; margin: .6rem 0 .2rem; }
		p { margin: .45rem 0; }
		section { border: 1px solid #ccd6ca; border-radius: .65rem; padding: clamp(1rem, 3vw, 1.6rem); margin-top: 1.3rem; background: #fff; }
		article { padding: 1rem 0; border-top: 1px solid #dbe1d8; }
		article:last-of-type { padding-bottom: .5rem; }
		.meta, small { color: #4b6057; }
		.meta { font-size: .88rem; }
		label { font-weight: 550; }
		.item { display: flex; align-items: baseline; gap: .55rem; }
		input[type="checkbox"] { accent-color: #185b47; width: 1.1rem; height: 1.1rem; flex: none; }
		input[type="text"] { font: inherit; background: #fff; color: inherit; padding: .45rem .65rem; border: 1px solid #82958a; border-radius: .3rem; max-width: 100%; }
		button, .button { cursor: pointer; font: inherit; font-weight: 600; border: 1px solid #185b47; background: #185b47; color: white; padding: .64rem 1rem; border-radius: .35rem; text-decoration: none; }
		button:hover, .button:hover { background: #104934; }
		.secondary { background: white; color: #244b3e; border-color: #879a8e; }
		.secondary:hover { background: #edf2eb; }
		:focus-visible { outline: 3px solid #ab601c; outline-offset: 3px; }
		.actions { display: flex; gap: .7rem; align-items: center; flex-wrap: wrap; margin-top: .8rem; }
		.notice { padding: .7rem 1rem; border-left: .25rem solid #3b7361; background: #e5efe4; margin: 1rem 0; }
		details { margin: .55rem 0; }
		summary { cursor: pointer; color: #27583f; font-weight: 550; }
		ul { padding-left: 1.4rem; margin: .25rem 0 .6rem; }
		blockquote { margin: .5rem 0; padding-left: .8rem; border-left: 2px solid #b4c5b6; }
		code, pre { font: .86rem/1.5 ui-monospace, monospace; overflow-wrap: anywhere; }
		pre { background: #f0f3ee; padding: .7rem; white-space: pre-wrap; }
		main { overflow-wrap: anywhere; }
	</style>
</head>
<body>
	<header>Jarvistark</header>
	<main><!-- workspace review --></main>
</body>
</html>
